<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative DSO138 interface preview</title>
  <desc id="desc">A stylized oscilloscope with black graticule, yellow square-wave trace, RUN, DC, 1 volt per division, 1 millisecond per division, and four front panel keys. Interface artwork only, not a device screenshot or measurement.</desc>
  <defs>
    <pattern id="minor" width="44" height="39" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V39" fill="none" stroke="#263740" stroke-width="1"/>
    </pattern>
    <pattern id="major" width="220" height="195" patternUnits="userSpaceOnUse">
      <path d="M220 0H0V195" fill="none" stroke="#40545e" stroke-width="1.5"/>
    </pattern>
    <filter id="glow" x="-.1" y="-.2" width="1.2" height="1.4">
      <feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1000" height="590" rx="28" fill="#d8dce0"/>
  <rect x="34" y="32" width="932" height="526" rx="22" fill="#bcc3c8" stroke="#929ba1" stroke-width="3"/>
  <rect x="68" y="64" width="730" height="452" rx="10" fill="#090f13" stroke="#26343b" stroke-width="8"/>
  <rect x="98" y="126" width="670" height="330" fill="#10191e"/>
  <rect x="98" y="126" width="670" height="330" fill="url(#minor)"/>
  <rect x="98" y="126" width="670" height="330" fill="url(#major)"/>
  <path d="M108 325H175V197H278V325H388V197H492V325H603V197H707V325H758" fill="none" stroke="#ffe45b" stroke-width="5" stroke-linejoin="round" filter="url(#glow)"/>
  <g fill="#d4e2e8" font-family="Arial, sans-serif">
    <text x="102" y="100" font-size="25" font-weight="700" letter-spacing="2">DSO138</text>
    <rect x="675" y="78" width="75" height="30" rx="5" fill="#1b8a61"/><text x="712" y="100" text-anchor="middle" font-size="16" font-weight="700">RUN</text>
    <text x="108" y="491" font-size="16">DC</text><text x="205" y="491" font-size="16">1 V/div</text><text x="357" y="491" font-size="16">1 ms/div</text><text x="651" y="491" font-size="16">NOM</text>
  </g>
  <g fill="#e4e7e9" stroke="#7f898e" stroke-width="2">
    <circle cx="858" cy="171" r="30"/><circle cx="913" cy="171" r="30"/>
    <circle cx="858" cy="245" r="30"/><circle cx="913" cy="245" r="30"/>
  </g>
  <g fill="#3b474e" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
    <text x="858" y="176">SEL</text><text x="913" y="176">+</text><text x="858" y="250">−</text><text x="913" y="250">OK</text>
  </g>
  <text x="500" y="545" text-anchor="middle" fill="#4d5960" font-family="Arial, sans-serif" font-size="14">ILLUSTRATIVE INTERFACE ART · NOT A DEVICE SCREENSHOT OR MEASURED TRACE</text>
</svg>
